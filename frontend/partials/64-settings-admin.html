  <div class="settings-group settings-group--admin">
  <div class="settings-group-label">Admin</div>
  <details class="setting-section" id="usersSection" style="display:none;">
    <summary class="setting-section-title"><svg class="setting-section-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg><span class="setting-section-label">User Management</span></summary>
    <div class="setting-section-body">
      <div id="usersList"></div>
      <div class="add-user-form">
        <input id="newUsername" type="text" placeholder="Username">
        <input id="newPassword" type="password" placeholder="Password">
        <label style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-muted);"><input type="checkbox" id="newIsAdmin" style="accent-color:var(--accent);"> Admin</label>
        <details class="perm-section">
          <summary class="perm-section-title">Formats</summary>
          <div class="perm-section-body">
            <label class="perm-check"><span>MP3</span> <input type="checkbox" id="newFmtMp3" checked></label>
            <label class="perm-check"><span>FLAC</span> <input type="checkbox" id="newFmtFlac" checked></label>
          </div>
        </details>
        <details class="perm-section">
          <summary class="perm-section-title">Methods</summary>
          <div class="perm-section-body">
            <label class="perm-check" title="Stahuje audio z YouTube, metadata ze Spotify"><span>YouTube</span> <input type="checkbox" id="newMethYtdlp" checked></label>
            <label class="perm-check" title="P2P stahování přes síť Soulseek, preferuje zvolený formát"><span>Soulseek</span> <input type="checkbox" id="newMethSlskd" checked></label>
            <label class="perm-check" title="Torrent stahování přes Lidarr, monitoruje diskografie"><span>Torrent</span> <input type="checkbox" id="newMethLidarr" checked></label>
          </div>
        </details>
        <button class="btn-add-user" id="addUserBtn">Add User</button>
      </div>
    </div>
  </details>
  <details class="setting-section" id="diskUsageSection" style="display:none;">
    <summary class="setting-section-title"><svg class="setting-section-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg><span class="setting-section-label">Disk Usage</span></summary>
    <div class="setting-section-body">
      <div id="diskUsageList"></div>
      <button class="btn-save" id="refreshDiskUsage" style="margin-top:8px;">Refresh</button>
    </div>
  </details>
  <details class="setting-section" id="feedbackSection" style="display:none;">
    <summary class="setting-section-title"><svg class="setting-section-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span class="setting-section-label">Feedback &amp; Reports</span></summary>
    <div class="setting-section-body">
      <div id="feedbackList"></div>
      <button class="btn-save" id="refreshFeedback" style="margin-top:8px;">Refresh</button>
    </div>
  </details>
  </div><!-- /settings-group: Admin -->
