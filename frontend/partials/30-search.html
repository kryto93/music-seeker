<!-- ── Search Page ── -->
<main id="pageSearch">
  <div class="search-container">
    <div class="search-row">
      <div class="search-input-wrap">
        <svg class="search-logo" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Title, artist, or lyrics...">
        <button id="searchClear" title="Clear">&times;</button>
      </div>
      <button class="btn-mic" id="micBtn" title="Identify song with microphone">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="1" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="btn-mic" id="partyBtn" title="Party mode: keep listening & collect songs into a playlist" aria-label="Party recognition">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.19 1.57-.79 3.06-2.3 3.5a4 4 0 0 1-4.24-1.14"/><path d="M11.5 12.5 15 16"/></svg>
      </button>
      <button class="btn-mic" id="appRefreshBtn" title="Refresh app (clear cache & reload)" aria-label="Refresh app">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      </button>
    </div>
    <div class="mic-status" id="micStatus"></div>
    <div class="mic-level" id="micLevel"><div class="mic-level-fill" id="micLevelFill"></div></div>
    <div class="type-toggle">
      <button class="type-btn active" data-type="all">All</button>
      <button class="type-btn" data-type="track">Tracks</button>
      <button class="type-btn" data-type="album">Albums</button>
      <button class="type-btn" data-type="artist">Artists</button>
      <button class="type-btn" data-type="playlist">Playlists</button>
      <button class="type-btn" data-type="show">Podcasts</button>
    </div>
    <div id="recentSearches" class="recent-searches" style="display:none;"></div>
  </div>
  <div class="recognize-result" id="recognizeResult">
    <div class="rr-label" id="rrLabel">Song identified</div>
    <div class="rr-header">
      <img class="rr-img" id="rrImg">
      <div class="rr-info">
        <div class="rr-title" id="rrTitle"></div>
        <div class="rr-artist" id="rrArtist"></div>
      </div>
      <div class="rr-actions">
        <button class="rr-btn rr-btn-download" id="rrDownload">Download</button>
        <button class="rr-btn rr-btn-search" id="rrSearch">Search</button>
        <button class="rr-btn-close" id="rrClose">&times;</button>
      </div>
    </div>
  </div>
  <!-- Shown by playlistimport.js when a Spotify/Deezer playlist or album link is
       pasted into the search box (it also hides #searchResults while it's up). -->
  <div id="importBanner" class="import-banner" style="display:none;"></div>
  <div id="searchResults" class="grid"></div>
  <div id="searchLoadMore" style="text-align:center; padding:20px; display:none;">
    <div class="skeleton" style="height:40px; width:200px; margin:0 auto;"></div>
  </div>
  <div id="showDetail" style="display:none; margin-top:24px;">
    <button id="backToSearch" class="tag-back-btn" style="margin-bottom:18px;">&larr; Back to results</button>
    <div class="playlist-hero">
      <img id="showDetailImg" class="playlist-hero-img">
      <div class="playlist-hero-info">
        <h2 id="showDetailName"></h2>
        <p id="showDetailPublisher" style="color:var(--text-muted); font-size:13px;"></p>
        <p id="showDetailCount"></p>
      </div>
      <div class="playlist-hero-actions" style="display:flex;gap:8px;">
        <button class="btn-download" id="downloadShow" style="width:auto; padding:12px 28px;">Download All</button>
        <button class="btn-check-new" id="subscribeShow" style="padding:12px 20px;font-size:14px;">Subscribe</button>
      </div>
    </div>
    <div id="showEpisodes" class="grid"></div>
  </div>
  <div id="artistDetail" style="display:none; margin-top:24px;">
    <button id="backFromArtist" class="tag-back-btn" style="margin-bottom:18px;">&larr; Back to results</button>
    <div class="playlist-hero">
      <img id="artistDetailImg" class="playlist-hero-img" style="border-radius:50%;">
      <div class="playlist-hero-info">
        <h2 id="artistDetailName"></h2>
        <p id="artistDetailCount"></p>
      </div>
      <div class="playlist-hero-actions">
        <button class="btn-download" id="downloadArtist" style="width:auto; padding:12px 28px;">Download All Albums</button>
      </div>
    </div>
    <div id="artistAlbums" class="grid"></div>
  </div>
  <div id="albumDetail" style="display:none; margin-top:24px;">
    <button id="backFromAlbum" class="tag-back-btn" style="margin-bottom:18px;">&larr; Back</button>
    <div class="playlist-hero">
      <img id="albumDetailImg" class="playlist-hero-img">
      <div class="playlist-hero-info">
        <h2 id="albumDetailName"></h2>
        <p id="albumDetailArtist" style="color:var(--text-muted); font-size:13px;"></p>
        <p id="albumDetailCount"></p>
      </div>
      <div class="playlist-hero-actions">
        <button class="btn-download btn-hero-primary" id="playAlbum">&#9654; Play All</button>
        <button class="btn-download btn-hero-secondary" id="shuffleAlbum">&#128256; Shuffle</button>
        <button class="btn-download btn-hero-secondary" id="queueAlbum">+ Add All</button>
        <button class="btn-download btn-hero-secondary" id="addAlbumToPlaylist">Add to playlist…</button>
        <button class="btn-download" id="downloadAlbum" style="width:auto; padding:12px 28px;">Download All</button>
      </div>
    </div>
    <div id="albumTracks" class="grid"></div>
  </div>
</main>
