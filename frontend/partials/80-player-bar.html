<!-- ── Player Bar ── -->
<div class="player-bar" id="playerBar">
  <img class="player-img" id="playerImg" alt="">
  <div class="player-text">
    <div class="player-title" id="playerTitle"></div>
    <div class="player-artist-row"><span class="player-artist" id="playerArtist"></span><span class="source-badge" id="playerSourceBadge"></span><span class="prefetch-status" id="prefetchStatus"></span></div>
  </div>
  <div class="player-controls">
    <button id="playerPrev" title="Previous"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg></button>
    <button class="player-play-btn" id="playerPlayPause" title="Play"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="playPauseIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="playerNext" title="Next"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2v12zM6 18l8.5-6L6 6v12z"/></svg></button>
  </div>
  <div class="player-progress-wrap">
    <span class="player-time" id="playerTimeCurrent">0:00</span>
    <div class="player-progress-bar" id="playerProgressBar">
      <div class="player-progress-fill" id="playerProgressFill"></div>
    </div>
    <span class="player-time" id="playerTimeTotal">0:00</span>
  </div>
  <div class="player-actions">
    <button class="like-btn" id="playerLike" title="Add to Liked Songs"></button>
    <button id="playerDevicesBtn" title="Remote devices"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></button>
    <button id="playerCastBtn" title="Cast to speaker"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 16.1A5 5 0 015.9 20M2 12.05A9 9 0 019.95 20M2 8V6a2 2 0 012-2h16a2 2 0 012 2v12a2 2 0 01-2 2h-6"/><line x1="2" y1="20" x2="2.01" y2="20"/></svg></button>
    <button id="playerQueueBtn" title="Queue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
    <button class="player-mode-btn" id="playerShuffle" title="Shuffle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
    <button class="player-mode-btn" id="playerRepeat" title="Repeat off"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg><span class="player-repeat-badge" id="playerRepeatBadge"></span></button>
    <button id="playerAddToPlaylist" title="Add to playlist"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
    <button id="playerRemoveFromPlaylist" title="Remove from playlist" style="display:none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
    <button id="playerDownloadBtn" title="Download current track"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
    <button id="playerMute" title="Mute"><svg id="playerMuteIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg></button>
    <input type="range" class="player-volume" id="playerVolume" min="0" max="100" value="100" title="Volume">
  </div>
  <audio id="audioElement" preload="none"></audio>
</div>

<!-- ── Remote Devices Popover ── -->
<div id="remoteDevicesPanel" class="remote-devices-panel" style="display:none;"></div>
