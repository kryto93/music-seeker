<!-- ── Login Screen ── -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3" fill="var(--accent)" stroke="none"/>
        <circle cx="18" cy="16" r="3" fill="var(--accent)" stroke="none"/>
      </svg>
    </div>
    <div class="logo-text">MusicSeeker</div>
    <p>Sign in to continue</p>
    <form id="loginForm" action="javascript:void(0)" method="post">
      <input id="loginUser" type="text" name="username" placeholder="Username" autocomplete="username">
      <input id="loginPass" type="password" name="password" placeholder="Password" autocomplete="current-password">
      <button class="btn-login" type="submit" id="loginBtn">Sign In</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
