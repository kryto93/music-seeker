<!-- ── Big Player Queue Panel (slides from bottom) ── -->
<div class="fp-queue-panel" id="fpQueuePanel">
  <div class="queue-drag-handle"></div>
  <div class="panel-header">
    Queue
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="btn-logout" id="fpQueueClear" style="font-size:11px;">Clear</button>
      <button class="panel-close" id="fpQueuePanelClose">&times;</button>
    </div>
  </div>
  <div class="queue-list" id="fpQueuePanelList">
    <div class="empty-state"><p>Queue is empty</p></div>
  </div>
</div>

<!-- ── Downloads Panel ── -->
<div class="downloads-panel" id="downloadsPanel">
  <div class="panel-header">
    Downloads
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="btn-logout" id="clearHistory" style="font-size:11px;">Clear History</button>
      <button class="panel-close" id="panelClose">&times;</button>
    </div>
  </div>
  <div class="jobs-list" id="jobsList">
    <div class="empty-state"><p>No downloads yet</p></div>
  </div>
</div>
