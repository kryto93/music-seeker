<!-- ── App (hidden until logged in) ── -->
<div id="appContainer" style="display:none;">

<nav>
  <button class="nav-btn active" data-page="search">Search</button>
  <button class="nav-btn" data-page="discover">Discover</button>
  <button class="nav-btn" data-page="library">Library</button>
  <button class="nav-btn" data-page="settings">Settings</button>
  <!-- Legacy hidden stub: "My Spotify" is now the Library → Spotify sub-tab.
       Kept in the DOM (force-hidden via .nav-legacy-hidden in nav.css) so the
       existing settings.js / auth.js hide_spotify handlers that target
       .nav-btn[data-page="playlists"] keep working without a null reference. -->
  <button class="nav-btn nav-legacy-hidden" data-page="playlists" aria-hidden="true" tabindex="-1">My Spotify</button>
  <div class="nav-spacer"></div>
  <button class="downloads-btn" id="downloadsToggle">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Downloads
    <span class="badge" id="jobsBadge"></span>
  </button>
  <div class="nav-user">
    <span id="navUsername"></span>
    <button class="btn-logout" id="logoutBtn">Logout</button>
  </div>
</nav>

<!-- ── Bottom Nav (mobile) ── -->
<div class="bottom-nav" id="bottomNav">
  <button class="bnav-btn active" data-page="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Search
  </button>
  <button class="bnav-btn" data-page="discover">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
    Discover
  </button>
  <button class="bnav-btn" data-page="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    Library
  </button>
  <!-- Legacy hidden stub (see desktop nav note): Spotify is now Library → Spotify. -->
  <button class="bnav-btn nav-legacy-hidden" data-page="playlists" aria-hidden="true" tabindex="-1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    Spotify
  </button>
  <button class="bnav-btn" data-page="downloads" id="bnavDownloads">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span class="bnav-badge" id="jobsBadgeMobile"></span>
    Downloads
  </button>
  <button class="bnav-btn" data-page="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Settings
  </button>
  <button class="bnav-btn bnav-now-playing" id="bnavNowPlaying" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    Playing
  </button>
</div>
